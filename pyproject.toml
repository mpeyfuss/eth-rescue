[project]
name = "eth-rescue"
version = "1.0.0"
description = "Run a JSON rescue plan that moves assets and contract control out of a compromised Ethereum account through private Flashbots bundles."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "eth-abi>=5.2.0",
    "eth-utils>=4.1.1",
    "pydantic>=2.13.4",
    "requests>=2.32",
    "rich>=14.0.0",
    "rich-argparse>=1.8.0",
    "urllib3>=2",
    "web3>=7.16,<8",
]

[project.urls]
Homepage = "https://github.com/mpeyfuss/eth-rescue"
Issues = "https://github.com/mpeyfuss/eth-rescue/issues"

[tool.uv]
required-version = ">=0.13.10,<0.14"
exclude-newer = "7 days"

[tool.pytest.ini_options]
markers = [
    "integration: requires a local Anvil blockchain",
]

[project.scripts]
eth-rescue = "eth_rescue.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.12",
]
