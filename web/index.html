    <script>
      // Applies the saved theme before first paint; mirrors src/theme.ts.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("eth-rescue:theme");
        } catch (e) {}
        if (choice !== "light" && choice !== "dark") {
          choice = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = choice;
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
