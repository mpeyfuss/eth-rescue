[profile.default]
src = 'src'
test = 'test'
out = 'out'
libs = ["dependencies"]
script = 'script'
# Everything below shapes the init code, and with it the CreateX address on every
# chain (script/Deploy.s.sol). Changing any of it, or the contract, moves the address.
solc = "0.8.38"
evm_version = "prague"
optimizer = true
optimizer_runs = 6900
bytecode_hash = "none"
cbor_metadata = false
verbosity = 3
show_progress = true

[fuzz]
runs = 1024

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }

[dependencies]
forge-std = "1.16.2"
solady = "0.1.26"
"@openzeppelin-contracts" = "5.6.1"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
