[project]
name = "eth-rescue"
version = "0.1.1"
description = "An interactive Ethereum CLI for recovering assets and contract control from an account whose private key or seed phrase has been compromised."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eth-abi>=5.2.0",
    "eth-utils>=4.1.1",
    "pydantic>=2.13.4",
    "requests>=2.32",
    "rich>=14.0.0",
    "web3>=7.16,<8",
]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
markers = [
    "integration: requires a local Anvil blockchain",
]

[project.scripts]
eth-rescue = "eth_rescue.cli:run"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.12",
]
